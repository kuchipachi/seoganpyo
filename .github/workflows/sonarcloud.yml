name: SonarCloud

# [kuchipachi 이전] 원본 org 토큰·시크릿이 없어 1차 동안 자동 트리거 비활성화 — 수동 실행만 허용
on:
  workflow_dispatch:
  # push:
    # branches: [dev, main]
  # pull_request:
    # types: [opened, synchronize, reopened]

# pull_request_target 이 아닌 pull_request 라 fork 의 PR 에선 SONAR_TOKEN 접근 불가.
# 학생 팀 프로젝트라 fork PR 은 거의 없어 무시. 만약 fork PR 도 분석하려면 workflow 를 별도로.
jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    # 본인 fork(또는 팀 레포)에서 푸시된 PR 만. SONAR_TOKEN 이 없으면 분석 무의미.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # SonarCloud 가 PR/blame 분석에 사용

      # 백엔드 커버리지 — Python coverage.xml 생성
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Backend deps & coverage
        env:
          TEST_DATABASE_URL: sqlite:///./test_ci.db
          SECRET_KEY: ci-test-secret
        run: |
          pip install -r requirements.txt --quiet
          mkdir -p reports
          pytest tests/ \
            --cov=app \
            --cov-report=xml:reports/coverage.xml \
            -q

      # SonarCloud 스캔
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # PR decoration 코멘트용
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
